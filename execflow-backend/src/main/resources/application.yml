spring:
  application:
    name: execflow-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/execflow}
    username: ${DB_USERNAME:execflow}
    password: ${DB_PASSWORD:execflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

# --- ExecFlow-specific config (never commit real values; see .env.example) ---
execflow:
  jwt:
    secret: ${JWT_SECRET:change-me-in-env-this-is-not-a-real-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  auth:
    # Invite-only registration: nobody can create an account without this
    # code. Set it in your .env and only share it with people you approve.
    registration-secret: ${REGISTRATION_SECRET:}

  ai:
    provider: groq
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      transcription-model: ${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}

  storage:
    local:
      base-path: ${STORAGE_BASE_PATH:./uploads}
